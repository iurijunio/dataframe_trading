# Camada 1 - Instrumento.
# Propriedades do contrato. Nao muda entre backtests, nao aparece na tela.
# Custos, horarios e dimensionamento NAO ficam aqui: sao do operador,
# vivem no perfil de execucao (camada 4) e sao editaveis na interface.

symbol: "MES"
description: "Micro E-mini S&P 500 - serie continua (London Strategic Edge)"
exchange: "CME"
currency: "USD"
timezone: "America/New_York"

# Precos guardados como inteiro x 100 (5432.25 vira 543225).
price_decimals: 2
tick_size: 0.25 # pontos, como o usuario le
point_value: 5.00 # US$ por ponto, por contrato
tick_value: 1.25 # tick_size * point_value

# Day trade puro; a fonte ja entrega serie continua.
allows_overnight: false
rollover_policy: "none"

# Relogio de pregao: o pregao comeca as 18:00 de NY (domingo a noite) e o
# motor enxerga essa hora como 00:00 (deslocamento de +6h sobre a hora de NY).
sessao_abertura: "18:00"
abertura_referencia: "09:30"

